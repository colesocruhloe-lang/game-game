<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080b14"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Pulse Drop</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b14;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;touch-action:none}body{display:grid;place-items:center}.game{position:relative;width:min(100vw,480px);height:100dvh;max-height:900px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#17234a 0,#0c1021 42%,#070912 100%)}canvas{position:absolute;inset:0;width:100%;height:100%}.hud{position:absolute;z-index:3;top:max(18px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-weight:800}.score{font-size:34px;text-shadow:0 3px 15px #000}.best{font-size:14px;opacity:.8}.pill{background:#ffffff12;border:1px solid #ffffff20;border-radius:99px;padding:8px 12px}.screen{position:absolute;z-index:5;inset:0;display:grid;place-items:center;padding:30px;background:#050711cc;backdrop-filter:blur(5px)}.card{text-align:center;width:min(90%,360px);padding:30px 22px;border:1px solid #ffffff1c;border-radius:28px;background:#0d1224e8;box-shadow:0 25px 80px #0009}.logo{font-size:46px;font-weight:950;letter-spacing:-2px}.sub{opacity:.72;line-height:1.5;margin:8px 0 24px}.btn{border:0;border-radius:18px;padding:16px 26px;font-size:18px;font-weight:900;color:#08101b;background:#fff;cursor:pointer;box-shadow:0 10px 30px #0006}.hint{margin-top:18px;font-size:12px;opacity:.45}.hidden{display:none}.tap{position:absolute;z-index:2;inset:0}
</style></head><body><main class="game"><canvas id="c"></canvas><div class="hud"><div><div class="score" id="score">0</div><div class="best">BEST <span id="best">0</span></div></div><div class="pill" id="combo">x1</div></div><div class="tap" id="tap"></div><section class="screen" id="menu"><div class="card"><div class="logo">PULSE<br>DROP</div><div class="sub">Tap the glowing pulse when it reaches the target. Build your combo and survive as long as you can.</div><button class="btn" id="start">PLAY</button><div class="hint">One tap. One chance. Beat your record.</div></div></section><section class="screen hidden" id="over"><div class="card"><div style="font-size:14px;opacity:.6">GAME OVER</div><div class="logo" id="final">0</div><div class="sub">Best: <b id="finalBest">0</b></div><button class="btn" id="again">PLAY AGAIN</button></div></section></main>
<script>
(()=>{const c=document.getElementById('c'),x=c.getContext('2d'),game=document.querySelector('.game'),tap=document.getElementById('tap'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),comboEl=document.getElementById('combo'),menu=document.getElementById('menu'),over=document.getElementById('over'),final=document.getElementById('final'),finalBest=document.getElementById('finalBest');let W,H,dpr,playing=false,score=0,combo=1,best=+localStorage.pulseBest||0,t=0,last=0,target=0,orb=0,particles=[];bestEl.textContent=best;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=game.clientWidth;H=game.clientHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);target=W*.5}addEventListener('resize',resize);resize();
function start(){playing=true;score=0;combo=1;t=0;last=performance.now();orb=H*.18;particles=[];scoreEl.textContent=0;comboEl.textContent='x1';menu.classList.add('hidden');over.classList.add('hidden');requestAnimationFrame(loop)}
function end(){playing=false;best=Math.max(best,score);localStorage.pulseBest=best;final.textContent=score;finalBest.textContent=best;over.classList.remove('hidden');navigator.vibrate?.([30,50,80])}
function burst(px,py){for(let i=0;i<18;i++){let a=Math.random()*Math.PI*2,s=60+Math.random()*160;particles.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:2+Math.random()*4,l:1})}}
function hit(){if(!playing)return;let centerY=H*.48,dist=Math.abs(orb-centerY),zone=42+Math.min(combo*2,22);if(dist<=zone){score+=combo;combo=Math.min(20,combo+1);scoreEl.textContent=score;comboEl.textContent='x'+combo;burst(target,orb);navigator.vibrate?.(10);orb=H*.18}else{combo=1;comboEl.textContent='x1';orb=H*.18}}
tap.addEventListener('pointerdown',e=>{if(playing)hit()});document.getElementById('start').onclick=start;document.getElementById('again').onclick=start;
function loop(now){if(!playing)return;let dt=Math.min(.032,(now-last)/1000);last=now;orb+=dt*(210+combo*11);if(orb>H+50){end();return}draw(dt);requestAnimationFrame(loop)}
function draw(dt){x.clearRect(0,0,W,H);let cy=H*.48;x.save();x.globalAlpha=.18;x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();x.moveTo(24,cy);x.lineTo(W-24,cy);x.stroke();x.globalAlpha=.07;for(let r=50;r<Math.max(W,H);r+=45){x.beginPath();x.arc(target,cy,r,0,Math.PI*2);x.stroke()}x.restore();let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#4be8ff');g.addColorStop(1,'#8b5cff');x.fillStyle=g;x.beginPath();x.arc(target,cy,46,0,Math.PI*2);x.globalAlpha=.09;x.fill();x.globalAlpha=1;x.strokeStyle='#ffffff99';x.lineWidth=2;x.stroke();x.fillStyle='#fff';x.shadowBlur=28;x.shadowColor='#63eaff';x.beginPath();x.arc(target,orb,18,0,Math.PI*2);x.fill();x.shadowBlur=0;for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=110*dt;p.l-=dt*1.8;x.globalAlpha=Math.max(0,p.l);x.fillStyle='#fff';x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fill();if(p.l<=0)particles.splice(i,1)}x.globalAlpha=1}
})();</script></body></html>
